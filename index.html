<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Obbligo & Verità">
    <link rel="manifest" href="manifest.json">
    <title>Obbligo & Verità - Jaco e Sonia</title>
    
    <!-- Google Fonts per un look moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0708;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 30px 20px;
            overflow: hidden;
            position: relative;
        }

        /* Sfondo con sfumatura radiale soffusa */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0c0f 0%, #0b0708 80%);
            z-index: -1;
        }

        /* Header / Titolo */
        header {
            text-align: center;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ff3b3b;
            text-shadow: 0 0 15px rgba(255, 59, 59, 0.4);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: #8c7578;
            text-transform: uppercase;
        }

        /* Card Centrale Principale */
        .card-container {
            width: 100%;
            max-width: 380px;
            background: #140a0c;
            border: 1px solid rgba(255, 59, 59, 0.35);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 25px rgba(255, 59, 59, 0.12), inset 0 0 15px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: auto 0;
            transition: all 0.3s ease;
        }

        .card-header-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: #8c7578;
            text-transform: uppercase;
        }

        .badge-type {
            border: 1px solid rgba(255, 59, 59, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            color: #ff5c5c;
            font-weight: 600;
        }

        /* Area Illustrazione / Icona Centrale */
        .illustration-box {
            width: 170px;
            height: 170px;
            background: #0d0608;
            border: 1px solid rgba(255, 59, 59, 0.5);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0 20px 0;
            box-shadow: 0 0 15px rgba(255, 59, 59, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Silhouette SVG del diavoletto in stile con l'immagine */
        .illustration-box svg {
            width: 110px;
            height: 110px;
            fill: #ff3b3b;
            filter: drop-shadow(0 0 8px rgba(255, 59, 59, 0.6));
        }

        /* Testo della Domanda / Azione */
        .card-text {
            font-size: 1.05rem;
            font-weight: 400;
            text-align: center.important;
            text-align: center;
            line-height: 1.5;
            color: #f1f1f1;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .card-footer-info {
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: #8c7578;
            text-transform: uppercase;
            margin-top: 15px;
        }

        /* Pulsanti di Selezione in Basso */
        .nav-buttons {
            width: 100%;
            max-width: 380px;
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            border: 1px solid rgba(255, 59, 59, 0.3);
            background: #160b0e;
            color: #d1b2b6;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* Pulsante Attivo / Evidenziato */
        .btn.active, .btn:hover {
            background: linear-gradient(135deg, #7a1c24 0%, #4a0d12 100%);
            color: #ffffff;
            border-color: #ff3b3b;
            box-shadow: 0 0 15px rgba(255, 59, 59, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>OBBLIGO & VERITÀ</h1>
        <div class="subtitle">Jaco e Sonia</div>
    </header>

    <!-- Card Centrale Interattiva -->
    <div class="card-container" id="cardContainer" onclick="estraiCasuale()">
        <div class="card-header-info">
            <span id="categoriaCorrente">Coppia</span>
            <span class="badge-type" id="tipoCorrente">Verità</span>
        </div>

        <div class="illustration-box">
            <!-- Icona SVG personalizzata (Diavoletto / Succube) -->
            <svg viewBox="0 0 24 24">
                <path d="M12,2C10.5,2 9.2,2.8 8.5,4C7.8,3.5 7,3.2 6.2,3.5C5.5,3.8 5,4.5 5,5.3C5,5.6 5.1,5.9 5.2,6.2C3.8,7.1 3,8.7 3,10.5C3,13.2 4.8,15.5 7.3,16.2C7.1,16.8 7,17.4 7,18C7,20.2 8.8,22 11,22H13C15.2,22 17,20.2 17,18C17,17.4 16.9,16.8 16.7,16.2C19.2,15.5 21,13.2 21,10.5C21,8.7 20.2,7.1 18.8,6.2C18.9,5.9 19,5.6 19,5.3C19,4.5 18.5,3.8 17.8,3.5C17,3.2 16.2,3.5 15.5,4C14.8,2.8 13.5,2 12,2M11,4H13C13.6,4 14.1,4.4 14.3,5C13.9,5.1 13.5,5.3 13.2,5.6C12.8,5.3 12.4,5.1 12,5.1C11.6,5.1 11.2,5.3 10.8,5.6C10.5,5.3 10.1,5.1 9.7,5C9.9,4.4 10.4,4 11,4M6.5,7.2C7.3,7 8,7.4 8.4,8C8.9,8.7 8.8,9.6 8.2,10.1C7.8,10.5 7.3,10.6 6.8,10.4C6.3,10.2 6,9.7 6,9.2C6,8.4 6.1,7.6 6.5,7.2M17.5,7.2C17.9,7.6 18,8.4 18,9.2C18,9.7 17.7,10.2 17.2,10.4C16.7,10.6 16.2,10.5 15.8,10.1C15.2,9.6 15.1,8.7 15.6,8C16,7.4 16.7,7 17.5,7.2M12,7C13.7,7 15,8.3 15,10C15,11.3 14.1,12.5 12.8,12.9V15H14.5C15.3,15 16,15.7 16,16.5C16,16.9 15.7,17.3 15.3,17.5C14.5,17.9 13.8,18.1 13,18.1V20H11V18.1C10.2,18.1 9.5,17.9 8.7,17.5C8.3,17.3 8,16.9 8,16.5C8,15.7 8.7,15 9.5,15H11.2V12.9C9.9,12.5 9,11.3 9,10C9,8.3 10.3,7 12,7Z"/>
            </svg>
        </div>

        <div class="card-text" id="testoDomanda">Tocca la card o seleziona una modalità in basso per iniziare...</div>
        
        <div class="card-footer-info">Jaco & Sonia - Tocca per girare</div>
    </div>

    <!-- Pulsanti di Filtro / Azione in Basso -->
    <div class="nav-buttons">
        <button class="btn active" id="btnVerita" onclick="impostaFiltro('verita')">Verità</button>
        <button class="btn" id="btnObbligo" onclick="impostaFiltro('obbligo')">Obbligo</button>
        <button class="btn" id="btnRandom" onclick="impostaFiltro('random')">Random</button>
    </div>

    <script>
        // Database delle domande (puoi integrarlo o espanderlo a piacimento)
        const database = [
            { tipo: 'verita', testo: 'Qual è la fantasia più spinta che non hai mai avuto il coraggio di raccontarmi?' },
            { tipo: 'verita', testo: 'Cosa ti eccita di più quando siamo soli e nessuno ci vede?' },
            { tipo: 'verita', testo: 'Qual è il ricordo più sensuale che hai della nostra prima volta insieme?' },
            { tipo: 'obbligo', testo: 'Fai un massaggio sensuale di 2 minuti dove preferisci.' },
            { tipo: 'obbligo', testo: 'Bendati e indovina una parte del mio corpo usando solo le labbra.' },
            { tipo: 'obbligo', testo: 'Sussurrami all\'orecchio con voce provocante cosa vorresti farti fare stasera.' }
        ];

        let modalitaAttiva = 'verita'; // default

        function impostaFiltro(tipo) {
            modalitaAttiva = tipo;
            
            // Aggiorna classi visive dei bottoni
            document.getElementById('btnVerita').classList.remove('active');
            document.getElementById('btnObbligo').classList.remove('active');
            document.getElementById('btnRandom').classList.remove('active');
            
            if(tipo === 'verita') document.getElementById('btnVerita').classList.add('active');
            if(tipo === 'obbligo') document.getElementById('btnObbligo').classList.add('active');
            if(tipo === 'random') document.getElementById('btnRandom').classList.add('active');

            estraiCasuale();
        }

        function estraiCasuale() {
            let filtrati = database;
            if (modalitaAttiva !== 'random') {
                filtrati = database.filter(item => item.tipo === modalitaAttiva);
            }

            if (filtrati.length === 0) return;

            const randomIndex = Math.floor(Math.random() * filtrati.length);
            const estratto = filtrati[randomIndex];

            // Aggiorna interfaccia
            document.getElementById('tipoCorrente').innerText = estratto.tipo.toUpperCase();
            document.getElementById('testoDomanda').innerText = `"${estratto.testo}"`;
        }

        // Registrazione Service Worker per PWA Offline
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrato con successo:', reg.scope))
                    .catch(err => console.log('Registrazione Service Worker fallita:', err));
            });
        }
    </script>
</body>
</html>
