<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Obbligo & Verità">
    <link rel="manifest" href="manifest.json">
    <title>Obbligo & Verità - Jaco e Sonia</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0708;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 30px 20px;
            overflow: hidden;
            position: relative;
        }

        /* Sfondo con sfumatura radiale soffusa */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a0c0f 0%, #0b0708 80%);
            z-index: -1;
        }

        /* Header / Titolo */
        header {
            text-align: center;
            margin-top: 10px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ff3b3b;
            text-shadow: 0 0 15px rgba(255, 59, 59, 0.4);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 3px;
            color: #8c7578;
            text-transform: uppercase;
        }

        /* Card Centrale Principale */
        .card-container {
            width: 100%;
            max-width: 380px;
            background: #140a0c;
            border: 1px solid rgba(255, 59, 59, 0.35);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 25px rgba(255, 59, 59, 0.12), inset 0 0 15px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: auto 0;
            transition: all 0.3s ease;
        }

        .card-header-info {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: #8c7578;
            text-transform: uppercase;
        }

        .badge-type {
            border: 1px solid rgba(255, 59, 59, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            color: #ff5c5c;
            font-weight: 600;
        }

        /* Area Illustrazione Centrale (Cornice quadrata con dentro la silhouette corretta) */
        .illustration-box {
            width: 170px;
            height: 170px;
            background: #0d0608;
            border: 1.5px solid #8B1E24;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0 15px 0;
            box-shadow: 0 0 15px rgba(139, 30, 36, 0.4), inset 0 0 10px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        /* Silhouette SVG corretta: Ragazza con corna e coda da diavoletta */
        .illustration-box svg {
            width: 125px;
            height: 125px;
            fill: #c92a32;
            filter: drop-shadow(0 0 8px rgba(255, 59, 59, 0.5));
        }

        /* Testo della Domanda / Azione */
        .card-text {
            font-size: 1.05rem;
            font-weight: 400;
            text-align: center;
            line-height: 1.5;
            color: #f1f1f1;
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .card-footer-info {
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: #8c7578;
            text-transform: uppercase;
            margin-top: 15px;
        }

        /* Pulsanti di Selezione in Basso */
        .nav-buttons {
            width: 100%;
            max-width: 380px;
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px 10px;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            border: 1px solid rgba(255, 59, 59, 0.3);
            background: #160b0e;
            color: #d1b2b6;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn.active, .btn:hover {
            background: linear-gradient(135deg, #7a1c24 0%, #4a0d12 100%);
            color: #ffffff;
            border-color: #ff3b3b;
            box-shadow: 0 0 15px rgba(255, 59, 59, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>OBBLIGO & VERITÀ</h1>
        <div class="subtitle">Jaco e Sonia</div>
    </header>

    <!-- Card Centrale Interattiva -->
    <div class="card-container" id="cardContainer" onclick="estraiCasuale()">
        <div class="card-header-info">
            <span id="categoriaCorrente">Coppia</span>
            <span class="badge-type" id="tipoCorrente">Verità</span>
        </div>

        <div class="illustration-box">
            <!-- Silhouette esatta della diavoletta vista nell'immagine di riferimento -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2C11.3 2 10.7 2.4 10.4 3C9.8 2.6 9 2.5 8.4 2.8C7.8 3.1 7.4 3.7 7.3 4.4C6.5 4.7 5.9 5.4 5.7 6.2C5 6.6 4.5 7.3 4.3 8.1C3.8 9 3.8 10 4.1 10.9C4.3 11.5 4.6 12.1 5 12.6C4.8 13.3 4.8 14 5 14.7C5.3 16 6 17.2 7 18.1C7.3 19.3 8.1 20.3 9.2 21C10.3 21.7 11.6 22 13 22C14.8 22 16.5 21.2 17.8 19.9C18.6 19.1 19.2 18.1 19.5 17C20.3 16.3 20.8 15.3 21 14.2C21.2 13.1 21 12 20.5 11C20.2 10.2 19.7 9.5 19 9C19.1 8.5 19 8 18.8 7.5C18.5 6.8 18 6.2 17.4 5.8C17.2 5 16.7 4.3 16 3.9C15.3 3.5 14.5 3.4 13.7 3.6C13.3 2.6 12.7 2 12 2M11.5 4C11.8 4 12.1 4.2 12.3 4.5C12.1 4.6 11.8 4.7 11.6 4.9C11.4 4.7 11.1 4.6 10.8 4.5C11 4.2 11.2 4 11.5 4M7.8 7.2C8.2 7.2 8.6 7.5 8.8 7.9C9 8.3 9 8.8 8.7 9.2C8.5 9.6 8 9.9 7.6 9.8C7.2 9.7 6.9 9.3 6.9 8.9C6.9 8.2 7.3 7.5 7.8 7.2M16.2 7.2C16.7 7.5 17.1 8.2 17.1 8.9C17.1 9.3 16.8 9.7 16.4 9.8C16 9.9 15.5 9.6 15.3 9.2C15 8.8 15 8.3 15.2 7.9C15.4 7.5 15.8 7.2 16.2 7.2M12 6.5C13.8 6.5 15.2 7.9 15.2 9.7C15.2 10.5 14.9 11.2 14.5 11.8C15.4 12.3 16 13.3 16.1 14.4C16.2 15.1 16 15.8 15.6 16.4C16.5 17.1 17.1 18 17.3 19C16.2 20.1 14.7 20.8 13 20.8C11.6 20.8 10.4 20.3 9.4 19.5C9.7 18.4 10.4 17.5 11.3 16.8C10.8 16.1 10.6 15.3 10.7 14.4C10.8 13.3 11.4 12.3 12.3 11.8C11.9 11.2 11.6 10.5 11.6 9.7C11.6 7.9 13 6.5 12 6.5Z"/>
            </svg>
        </div>

        <div class="card-text" id="testoDomanda">Tocca la card o seleziona una modalità in basso per iniziare...</div>
        
        <div class="card-footer-info">Jaco & Sonia - Tocca per girare</div>
    </div>

    <!-- Pulsanti di Filtro / Azione in Basso -->
    <div class="nav-buttons">
        <button class="btn active" id="btnVerita" onclick="impostaFiltro('verita')">Verità</button>
        <button class="btn" id="btnObbligo" onclick="impostaFiltro('obbligo')">Obbligo</button>
        <button class="btn" id="btnRandom" onclick="impostaFiltro('random')">Random</button>
    </div>

    <script>
        const database = [
            { tipo: 'verita', testo: 'Qual è la fantasia più spinta che non hai mai avuto il coraggio di raccontarmi?' },
            { tipo: 'verita', testo: 'Cosa ti eccita di più quando siamo soli e nessuno ci vede?' },
            { tipo: 'verita', testo: 'Qual è il ricordo più sensuale che hai della nostra prima volta insieme?' },
            { tipo: 'obbligo', testo: 'Fai un massaggio sensuale di 2 minuti dove preferisci.' },
            { tipo: 'obbligo', testo: 'Bendati e indovina una parte del mio corpo usando solo le labbra.' },
            { tipo: 'obbligo', testo: 'Sussurrami all\'orecchio con voce provocante cosa vorresti farti fare stasera.' }
        ];

        let modalitaAttiva = 'verita';

        function impostaFiltro(tipo) {
            modalitaAttiva = tipo;
            
            document.getElementById('btnVerita').classList.remove('active');
            document.getElementById('btnObbligo').classList.remove('active');
            document.getElementById('btnRandom').classList.remove('active');
            
            if(tipo === 'verita') document.getElementById('btnVerita').classList.add('active');
            if(tipo === 'obbligo') document.getElementById('btnObbligo').classList.add('active');
            if(tipo === 'random') document.getElementById('btnRandom').classList.add('active');

            estraiCasuale();
        }

        function estraiCasuale() {
            let filtrati = database;
            if (modalitaAttiva !== 'random') {
                filtrati = database.filter(item => item.tipo === modalitaAttiva);
            }

            if (filtrati.length === 0) return;

            const randomIndex = Math.floor(Math.random() * filtrati.length);
            const estratto = filtrati[randomIndex];

            document.getElementById('tipoCorrente').innerText = estratto.tipo.toUpperCase();
            document.getElementById('testoDomanda').innerText = `"${estratto.testo}"`;
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrato:', reg.scope))
                    .catch(err => console.log('Errore SW:', err));
            });
        }
    </script>
</body>
</html>
